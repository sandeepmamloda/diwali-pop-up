<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali – Fireworks 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Yatra+One&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ui:rgba(255,255,255,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;color:var(--ui);font-family:'Russo One',Arial,sans-serif;letter-spacing:.06em}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#glow{position:fixed;left:0;right:0;bottom:0;height:40%;pointer-events:none;mix-blend-mode:screen}
.ly{position:fixed;left:-4%;bottom:0;width:108%;pointer-events:none;display:block;will-change:transform}
#l1{height:15%}#l2{height:10%}#sil{height:6%}
#sk{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(to top,rgba(26,38,78,.55) 0%,rgba(12,18,42,.35) 22%,rgba(5,8,20,.2) 55%,rgba(0,0,0,0) 100%)}
#ctl{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;transition:opacity .3s}
#ctl.off{opacity:0;pointer-events:none}
.b{width:50px;height:50px;border:0;background:none;color:#fff;font-size:22px;opacity:.2;cursor:pointer;transition:opacity .3s}
.b:hover{opacity:.5}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center}
#menu.on{display:flex}
.in{width:100%;max-width:400px;padding:16px;max-height:100%;overflow:auto}
h2{margin:0 0 14px;text-align:center;text-transform:uppercase;font-weight:400;font-size:2em}
label{display:flex;align-items:center;margin:14px 0;text-transform:uppercase}
label>span{width:50%;padding-right:12px;text-align:right}
select{width:50%;height:30px;font:inherit;color:var(--ui);background:transparent;border:1px solid var(--ui)}
select option{background:#000}
input[type=checkbox]{width:26px;height:26px;margin:0;opacity:.6}
#cl{display:block;margin:18px auto 0;font:inherit;color:#fff;background:rgba(255,255,255,.25);border:0;border-radius:2px;padding:6px 18px;text-transform:uppercase;cursor:pointer}
#cl:hover{background:#09f}
small{display:block;text-align:center;opacity:.7;margin-top:14px;font-size:.75em}
#hd{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;animation:hd 11s ease-in-out 1.2s forwards;letter-spacing:0}
#hd .hi{font-family:'Yatra One','Noto Sans Devanagari',serif;font-size:clamp(26px,5.5vw,64px);letter-spacing:.08em;background:linear-gradient(180deg,#fff3c4,#ffb938 55%,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,140,20,.75))}
#hd .en{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(64px,17vw,200px);line-height:1.05;margin-top:.05em;background:linear-gradient(180deg,#fffbe8 0%,#ffd86b 50%,#ff9d2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,150,30,.8)) drop-shadow(0 0 60px rgba(255,80,0,.5))}
#hd .or{font-size:clamp(14px,2.4vw,26px);color:#ffcf6b;opacity:.85;letter-spacing:.7em;margin-top:.4em;text-shadow:0 0 12px rgba(255,140,20,.8)}
@keyframes hd{0%{opacity:0;transform:scale(.94);filter:blur(8px)}16%,72%{opacity:1;transform:scale(1);filter:none}100%{opacity:0;transform:scale(1.04);filter:blur(4px)}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="sk"></div>
<svg class="ly" id="l1" viewBox="0 0 200 20" preserveAspectRatio="none"></svg>
<svg class="ly" id="l2" viewBox="0 0 200 20" preserveAspectRatio="none"></svg>
<div id="glow"></div>
<svg class="ly" id="sil" viewBox="0 0 200 10" preserveAspectRatio="none"></svg>
<div id="hd"><div class="hi">शुभ दीपावली</div><div class="en">Happy Diwali</div><div class="or">✦ ❖ ✦</div></div>
<div id="ctl"><button class="b" id="bp">⏸</button><button class="b" id="bm">⚙</button></div>
<div id="menu"><div class="in"><h2>Settings</h2>
<label><span>Shell Type</span><select id="o_shell"></select></label>
<label><span>Shell Size</span><select id="o_size"></select></label>
<label><span>Quality</span><select id="o_q"></select></label>
<label><span>Sky Lighting</span><select id="o_sky"></select></label>
<label><span>Auto Fire</span><input type="checkbox" id="o_auto"></label>
<label><span>Finale Mode</span><input type="checkbox" id="o_fin"></label>
<label><span>Hide Controls</span><input type="checkbox" id="o_hide"></label>
<label><span>Open Shutter</span><input type="checkbox" id="o_shut"></label>
<button id="cl">Close</button><small>Click / tap anywhere to fire a shell · P pause · O menu</small></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const R=Math.random,TAU=Math.PI*2,rnd=(a,b)=>a+R()*(b-a),$=id=>document.getElementById(id);
const IS_MOBILE=innerWidth<=640,HI=(navigator.hardwareConcurrency||0)>=(innerWidth<=1024?4:8);
const cfg={quality:HI?3:2,shell:'Random',size:IS_MOBILE?2:3,auto:true,finale:false,sky:2,shutter:false,hide:false};
let paused=false,menuOpen=false;
const QL=()=>+cfg.quality,low=()=>QL()===1,high=()=>QL()===3,running=()=>!paused&&!menuOpen;

// ---------- colours
const mk=(r,g,b)=>({r,g,b}),COLOR={Red:mk(255,0,67),Green:mk(20,252,86),Blue:mk(30,127,255),Purple:mk(230,10,255),Gold:mk(255,191,54),Orange:mk(255,105,15),Pink:mk(255,40,140),White:mk(255,255,255)},INV=mk(0,0,0);
const WC=[COLOR.Gold,COLOR.Gold,COLOR.Gold,COLOR.Orange,COLOR.Orange,COLOR.Red,COLOR.Pink,COLOR.Green,COLOR.Blue,COLOR.Purple,COLOR.White],rc0=()=>WC[R()*WC.length|0];let lastColor;
function randomColor(o={}){let c=rc0();if(o.limitWhite&&c===COLOR.White&&R()<.6)c=rc0();
  if(o.notSame)while(c===lastColor)c=rc0();else if(o.notColor)while(c===o.notColor)c=rc0();lastColor=c;return c}
const whiteOrGold=()=>R()<.5?COLOR.Gold:COLOR.White,pistilFor=c=>(c===COLOR.White||c===COLOR.Gold)?randomColor({notColor:c}):whiteOrGold();

// ---------- shell types
const chrys=(s=1)=>{const glitter=R()<.65,single=R()<.72,color=single?randomColor({limitWhite:true}):[randomColor(),randomColor({notSame:true})],
  pistil=single&&R()<.45,pc=pistil&&pistilFor(color),second=single&&(R()<.2||color===COLOR.White)?pc||randomColor({notColor:color,limitWhite:true}):null,
  streamers=!pistil&&color!==COLOR.White&&R()<.42;let d=glitter?1.9:2.1;if(low())d*=.8;if(high())d=2.2;
  return{shellSize:s,spreadSize:320+s*105,starLife:1000+s*220,starDensity:d,color,secondColor:second,glitter:glitter?'light':'',glitterColor:whiteOrGold(),pistil,pistilColor:pc,streamers}};
const ghost=(s=1)=>{const h=chrys(s);h.starLife*=1.5;const gc=randomColor({notColor:COLOR.White});h.streamers=true;h.color=INV;h.secondColor=gc;h.glitter='';return h};
const strobe=(s=1)=>{const color=randomColor({limitWhite:true});return{shellSize:s,spreadSize:280+s*92,starLife:1100+s*200,starLifeVariation:.4,starDensity:1.2,color,glitter:'light',glitterColor:COLOR.White,strobe:true,strobeColor:R()<.5?COLOR.White:null,pistil:R()<.5,pistilColor:pistilFor(color)}};
const palm=(s=1)=>{const thick=R()<.5;return{shellSize:s,color:randomColor(),spreadSize:250+s*75,starDensity:thick?.15:.4,starLife:1800+s*200,glitter:thick?'thick':'heavy'}};
const ring=(s=1)=>{const color=randomColor(),pistil=R()<.75;return{shellSize:s,ring:true,color,spreadSize:300+s*100,starLife:900+s*200,starCount:2.2*TAU*(s+1),pistil,pistilColor:pistilFor(color),glitter:!pistil?'light':'',glitterColor:color===COLOR.Gold?COLOR.Gold:COLOR.White,streamers:R()<.3}};
const crossette=(s=1)=>{const color=randomColor({limitWhite:true});return{shellSize:s,spreadSize:300+s*100,starLife:750+s*160,starLifeVariation:.4,starDensity:.85,color,crossette:true,pistil:R()<.5,pistilColor:pistilFor(color)}};
const floral=(s=1)=>({shellSize:s,spreadSize:300+s*120,starDensity:.12,starLife:500+s*50,starLifeVariation:.5,color:R()<.65?'random':(R()<.15?randomColor():[randomColor(),randomColor({notSame:true})]),floral:true});
const leaves=(s=1)=>({shellSize:s,color:INV,spreadSize:300+s*120,starDensity:.12,starLife:500+s*50,starLifeVariation:.5,glitter:'medium',glitterColor:COLOR.Gold,fallingLeaves:true});
const willow=(s=1)=>({shellSize:s,spreadSize:300+s*100,starDensity:.6,starLife:3000+s*300,glitter:'willow',glitterColor:COLOR.Gold,color:INV});
const crackle=(s=1)=>{const color=R()<.75?COLOR.Gold:randomColor();return{shellSize:s,spreadSize:380+s*75,starDensity:low()?.65:1,starLife:600+s*100,starLifeVariation:.32,glitter:'light',glitterColor:COLOR.Gold,color,crackle:true,pistil:R()<.65,pistilColor:pistilFor(color)}};
const horsetail=(s=1)=>{const color=randomColor();return{shellSize:s,horsetail:true,color,spreadSize:250+s*38,starDensity:.9,starLife:2500+s*300,glitter:'medium',glitterColor:R()<.5?whiteOrGold():color,strobe:color===COLOR.White}};
const swirl=(s=1)=>{const color=randomColor({limitWhite:true});return{shellSize:s,spreadSize:300+s*100,starLife:1500+s*200,starDensity:.9,color,secondColor:R()<.5?randomColor({notColor:color,limitWhite:true}):null,glitter:'light',glitterColor:whiteOrGold(),swirl:(R()<.5?1:-1)*(.05+R()*.025),pistil:R()<.5,pistilColor:pistilFor(color)}};
const randomShellName=()=>R()<.5?'Crysanthemum':shellNames[(R()*(shellNames.length-1)+1)|0];
const shellTypes={'Random':s=>shellTypes[randomShellName()](s),'Crackle':crackle,'Crossette':crossette,'Crysanthemum':chrys,'Falling Leaves':leaves,'Floral':floral,'Ghost':ghost,'Horse Tail':horsetail,'Palm':palm,'Ring':ring,'Strobe':strobe,'Swirl':swirl,'Willow':willow};
const shellNames=Object.keys(shellTypes),shellFromConfig=s=>shellTypes[cfg.shell](s),shellSize=()=>+cfg.size;
const fastBlack=['Falling Leaves','Floral','Willow'];
function randomFastShell(){const r_=cfg.shell==='Random';let n=r_?randomShellName():cfg.shell;if(r_)while(fastBlack.includes(n))n=randomShellName();return shellTypes[n]}

// ---------- three.js scene
const cvs=$('c'),renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:false,preserveDrawingBuffer:true});
renderer.autoClear=false;renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,10,6000),FADE=new THREE.Scene(),ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fadeMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.17,depthTest:false,depthWrite:false});
FADE.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),fadeMat));
const glow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const flashTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(.024,'rgba(255,255,255,1)');g.addColorStop(.125,'rgba(255,160,20,.2)');g.addColorStop(.32,'rgba(255,140,20,.11)');g.addColorStop(1,'rgba(255,120,20,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();

// twinkling starfield + faint Milky Way
const SN=15000,SP=new Float32Array(SN*3),SC=new Float32Array(SN*3),POLE=new THREE.Vector3(.15,.6,-.78).normalize();let skyA=0;
for(let i=0;i<SN;i++){let dx,dy,dz,rad,b;
  if(i<12000){dy=2*R()-1;const a=R()*TAU,r=Math.sqrt(1-dy*dy);dx=r*Math.cos(a);dz=r*Math.sin(a);rad=2200+R()*3000;b=.06+Math.pow(R(),4)*.4}
  else{const ph=R()*TAU,lat=(R()+R()+R()-1.5)*.16,bx=Math.cos(ph)*Math.cos(lat),by=Math.sin(lat),bz=Math.sin(ph)*Math.cos(lat),tl=.9;dx=bx;dy=by*Math.cos(tl)-bz*Math.sin(tl);dz=by*Math.sin(tl)+bz*Math.cos(tl);rad=4800;b=.03+R()*.11*Math.exp(-Math.abs(lat)/.08)}
  const t=R();SP[i*3]=dx*rad;SP[i*3+1]=dy*rad;SP[i*3+2]=dz*rad;SC[i*3]=b*(.8+.2*t);SC[i*3+1]=b*.9;SC[i*3+2]=b*(1-.2*t)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(SP,3));sg.setAttribute('color',new THREE.BufferAttribute(SC,3));
const SZ=new Float32Array(SN),TW=new Float32Array(SN*2);
for(let i=0;i<SN;i++){const b=SC[i*3+1]/.9;SZ[i]=i<12000?1.4+Math.min(.5,b)*9+(R()<.03?2.5:0):1.5;TW[i*2]=R()*TAU;TW[i*2+1]=.6+R()*2.2}
sg.setAttribute('size',new THREE.BufferAttribute(SZ,1));sg.setAttribute('tw',new THREE.BufferAttribute(TW,2));
const skyMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uScale:{value:1}},transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute float size;attribute vec2 tw;attribute vec3 color;uniform float uTime,uScale;varying vec3 vC;
void main(){float t=.6+.4*sin(uTime*tw.y+tw.x)*sin(uTime*tw.y*.37+tw.x*1.7);vC=color*(.55+t)*2.2;
gl_PointSize=size*uScale*(.8+.35*t);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying vec3 vC;void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;float core=exp(-d*d*28.),halo=pow(1.-d,3.)*.45;gl_FragColor=vec4(vC*(core*1.2+halo),1.);}`});
const skyStars=new THREE.Points(sg,skyMat);

// REAL-LOOK CHANGE: bigger quad budget (every star gets a ribbon trail now)
const CAPS=7000,CAPK=14000;
const PP=new Float32Array(CAPS*3),PC=new Float32Array(CAPS*3);
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(PP,3).setUsage(THREE.DynamicDrawUsage));pg.setAttribute('color',new THREE.BufferAttribute(PC,3).setUsage(THREE.DynamicDrawUsage));
const PR=Math.min(devicePixelRatio,2),CAPQ=CAPS*4+CAPK,QH=new Float32Array(CAPQ*12),QT=new Float32Array(CAPQ*12),QC=new Float32Array(CAPQ*12),QA=new Float32Array(CAPQ*12),QI=new Uint32Array(CAPQ*6);
for(let i=0;i<CAPQ;i++){const v=i*4;QI.set([v,v+1,v+2,v+1,v+3,v+2],i*6);for(let k=0;k<4;k++){QA[(v+k)*3]=k%2?1:-1;QA[(v+k)*3+1]=k>1?1:0}}
const lg=new THREE.BufferGeometry();
[['position',QH],['tail',QT],['color',QC],['aux',QA]].forEach(([n,a])=>lg.setAttribute(n,new THREE.BufferAttribute(a,3).setUsage(THREE.DynamicDrawUsage)));
lg.setIndex(new THREE.BufferAttribute(QI,1));
let nq=0;
function quad(x,y,z,tx,ty,tz,r,g,b,w,r2,g2,b2){if(nq>=CAPQ)return;const o=nq*12,e=r2!==undefined;for(let k=0;k<4;k++){const j=o+k*3,u=e&&k>1;QH[j]=x;QH[j+1]=y;QH[j+2]=z;QT[j]=tx;QT[j+1]=ty;QT[j+2]=tz;QC[j]=u?r2:r;QC[j+1]=u?g2:g;QC[j+2]=u?b2:b;QA[j+2]=w}nq++}
function ribbon(s,r,g,b){const S=Math.min(s.hn,H-1),Q=5;let px=s.x,py=s.y,pz=s.z;
  for(let q=0;q<Q;q++){const i=((s.hi-Math.round((q+1)*S/Q)+H*2)%H)*3,x=s.hx[i],y=s.hx[i+1],z=s.hx[i+2],k0=Math.pow(1-q/Q,1.6),k1=Math.pow(1-(q+1)/Q,1.6);
    quad(px,py,pz,x,y,z,r*k0,g*k0,b*k0,-1.1*PR,r*k1,g*k1,b*k1);px=x;py=y;pz=z}}
const rMat=new THREE.ShaderMaterial({uniforms:{uRes:{value:new THREE.Vector2(1,1)}},transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  vertexShader:`attribute vec3 tail;attribute vec3 color;attribute vec3 aux;uniform vec2 uRes;varying vec3 vC;varying vec3 vA;
void main(){vec4 a=projectionMatrix*modelViewMatrix*vec4(position,1.);vec4 b=projectionMatrix*modelViewMatrix*vec4(tail,1.);
vec2 sa=a.xy/a.w*uRes*.5,sb=b.xy/b.w*uRes*.5,d=sb-sa;float L=length(d);vec2 dir=L>.001?d/L:vec2(0.,1.);L=max(L,2.);
vec2 n=vec2(-dir.y,dir.x),p=sa+dir*L*aux.y+n*aux.x*abs(aux.z)*mix(1.,.2,aux.y*step(0.,aux.z));
vC=color;vA=vec3(aux.xy,aux.z<0.?1.:0.);gl_Position=vec4(p/(uRes*.5),0.,1.);}`,
  fragmentShader:`varying vec3 vC;varying vec3 vA;void main(){float t=1.-vA.y;gl_FragColor=vec4(vC*1.8,mix(t*t,1.,vA.z)*(1.-vA.x*vA.x));}`});
const pmat=o=>new THREE.PointsMaterial({map:glow,size:10,vertexColors:true,transparent:true,opacity:o,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(pg,pmat(1)),bloom=new THREE.Points(pg,pmat(.12));
const lines=new THREE.Mesh(lg,rMat);
[skyStars,bloom,pts,lines].forEach(o=>{o.frustumCulled=false;scene.add(o)});
const flashPool=[];let flashActive=[],glowB=0;
const lights=[];let shake=0;
function burstFlash(x,y,z,r,c){if(c!==undefined&&lights.length<24){c=Array.isArray(c)?c[0]:(c&&c!=='random'&&c!==INV?c:COLOR.Gold);lights.push({x,y,z,r:r*5,cr:c.r/255,cg:c.g/255,cb:c.b/255,i:Math.min(.8,r/70),life:3500,full:3500});if(r>60)shake=Math.min(1,shake+r/260)}
  const s=flashPool.pop()||new THREE.Sprite(new THREE.SpriteMaterial({map:flashTex,transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.position.set(x,y,z);const fr_=Math.min(r*1.9,240);s.scale.set(fr_,fr_,1);s.material.opacity=.9;scene.add(s);flashActive.push(s);glowB=Math.min(.4,glowB+r/2600)}

let aspect=1,FOV=42,TOP=38;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);aspect=w/h;FOV=aspect<.8?62:42;camera.fov=FOV;camera.aspect=aspect;
  const pitch=FOV/2-4;camera.rotation.set(pitch*Math.PI/180,0,0);TOP=pitch+FOV/2;camera.updateProjectionMatrix();
  // REAL-LOOK CHANGE: smaller, crisper star heads (no more big soft "dots")
  pts.material.size=3*2*1300/h*(FOV/42)*1.0;skyMat.uniforms.uScale.value=PR*Math.max(.8,h/900);bloom.material.size=pts.material.size*3.2;rMat.uniforms.uRes.value.set(renderer.domElement.width,renderer.domElement.height);
  renderer.setClearColor(0x000000,1);renderer.clear()}
addEventListener('resize',resize);resize();
function place(h,v,z){const az=Math.abs(z),hw=Math.tan(FOV*Math.PI/360)*aspect*az,f=.45+v*.5,e=(-4+f*(TOP+4))*Math.PI/180;return[(h*2-1)*hw*.88,az*Math.tan(e)]}
const rz=()=>-(950+R()*750);

// tree-line + mountain ridges
(()=>{let d='M0 10',h=4;for(let i=0;i<=200;i+=1.6){h+=(R()-.5)*2.2;h=Math.max(2.2,Math.min(6.5,h));const spike=R()<.35?R()*2.2:0;d+=` L${i.toFixed(1)} ${(10-h-spike).toFixed(2)} L${(i+.8).toFixed(1)} ${(10-h+.6).toFixed(2)}`}
  $('sil').innerHTML=`<path d="${d} L200 10 Z" fill="#000"/>`})();
const LY=[$('l1'),$('l2'),$('sil')];
[['l1','#0e1a36','#05070f',7,5.5],['l2','#070b18','#020309',4.5,3.6]].forEach(([id,c1,c2,base,amp],n)=>{
  const p=[R()*6,R()*6,R()*6],f=n?1.35:1;let d='M0 20';
  for(let i=0;i<=200;i+=1){const h=base+amp*(Math.sin(i*.028*f+p[0])*.5+Math.sin(i*.071*f+p[1])*.3+Math.sin(i*.17*f+p[2])*.2)+(R()-.5)*.35;d+=` L${i} ${(20-h).toFixed(2)}`}
  $(id).innerHTML=`<defs><linearGradient id="g${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><path d="${d} L200 20 Z" fill="url(#g${n})"/>`});

// ---------- particles
const H=20,TL=14,GRAV=.9,stars=[],sparks=[],starPool=[],sparkPool=[],D=[0,0,0];
// REAL-LOOK CHANGE: strong air drag -> shell snaps outward fast, then slows and hangs, then gravity takes over
const DRAG=.05,SPEEDK=2.3;
let wind=0,windT=R()*100;
function rdir(){const z=2*R()-1,a=R()*TAU,r=Math.sqrt(1-z*z);D[0]=r*Math.cos(a);D[1]=z;D[2]=r*Math.sin(a);return D}
function addStar(x,y,z,c,dx,dy,dz,sp,life,ox=0,oy=0,oz=0){const s=starPool.pop()||{};s.x=s.px=x;s.y=s.py=y;s.z=s.pz=z;s.vx=dx*sp+ox;s.vy=dy*sp+oy;s.vz=dz*sp+oz;s.life=s.full=life;s.c=c;s.sk=c;
  s.sf=0;s.ss=1;s.st=0;s.sl=750;s.slv=.25;s.strobe=false;s.vis=true;s.sc=null;s.trans=0;s.changed=false;s.death=null;s.path=null;s.spin=0;s.spinA=R()*TAU;s.sfq=50;s.hist=false;s.hn=0;s.hi=0;s.sw=0;
  if(stars.length<CAPS)stars.push(s);return s}
function addSpark(x,y,z,c,dx,dy,dz,sp,life){if(sparks.length>=CAPK)return;const s=sparkPool.pop()||{};s.x=s.px=x;s.y=s.py=y;s.z=s.pz=z;s.vx=dx*sp;s.vy=dy*sp;s.vz=dz*sp;s.life=s.full=life;s.c=c;sparks.push(s)}
const _q=new THREE.Quaternion(),_v=new THREE.Vector3(),_a=new THREE.Vector3();
// REAL-LOOK CHANGE: more random jitter so stars don't form a visibly perfect dotted sphere
function sphere(n,cb){n=Math.max(1,Math.round(n));_a.set(R()-.5,R()-.5,R()-.5).normalize();_q.setFromAxisAngle(_a,R()*TAU);const off=R()*TAU;
  for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=i*2.39996323+off;_v.set(Math.cos(t)*r,y,Math.sin(t)*r).applyQuaternion(_q);
    _v.x+=(R()-.5)*.5;_v.y+=(R()-.5)*.5;_v.z+=(R()-.5)*.5;_v.normalize();cb(_v.x,_v.y,_v.z)}}

function crossetteFx(s){sphere(4,(dx,dy,dz)=>addStar(s.x,s.y,s.z,s.c,dx,dy,dz,(R()*.6+.75)*SPEEDK,600))}
function floralFx(s){sphere(12+6*QL(),(dx,dy,dz)=>addStar(s.x,s.y,s.z,s.c,dx,dy,dz,2.4*SPEEDK,1000+R()*300,s.vx,s.vy,s.vz));burstFlash(s.x,s.y,s.z,46)}
function leavesFx(s){sphere(7,(dx,dy,dz)=>{const n=addStar(s.x,s.y,s.z,INV,dx,dy,dz,2.4*SPEEDK,2400+R()*600,s.vx,s.vy,s.vz);n.sk=COLOR.Gold;n.sf=144/QL();n.ss=.28;n.sl=750;n.slv=3.2});burstFlash(s.x,s.y,s.z,46)}
function crackleFx(s){const n=high()?32:16;for(let i=0;i<n;i++){rdir();addSpark(s.x,s.y,s.z,COLOR.Gold,D[0],D[1],D[2],Math.pow(R(),.45)*2.4,300+R()*200)}}
const GL={light:[400,.3,300,2],medium:[200,.44,700,2],heavy:[80,.8,1400,2],thick:[16,1.5,1400,3],streamer:[32,1.05,620,2],willow:[120,.34,1400,3.8]};

class Shell{
  constructor(o){Object.assign(this,o);this.starLifeVariation=o.starLifeVariation||.22;this.color=o.color||randomColor();this.glitterColor=o.glitterColor||this.color;
    if(!this.starCount){const d=o.starDensity||1,sc=this.spreadSize/54;this.starCount=Math.max(6,sc*sc*d)}}
  launch(h,v,z=rz()){const p=place(h,v,z);this.launchAt(p[0],p[1],z)}
  launchAt(x,y,z){const y0=-Math.abs(z)*.045,dist=y-y0,col=(this.color&&!Array.isArray(this.color)&&this.color!=='random')?this.color:COLOR.White,ht=this.horsetail,
      dur=ht?700+dist*.6:900+dist*1.3,c=this.comet=addStar(x,y0,z,col,0,1,0,0,dur);
    c.path={fx:x,fy:y0,fz:z,tx:x,ty:y,tz:z,lin:ht};c.spin=rnd(.32,.85)*8;if(ht)c.vy=dist/(dur/16.667);
    c.sf=high()?8:32/QL();c.sl=320;c.slv=3;
    if(this.glitter==='willow'||this.fallingLeaves){c.sf=20/QL();c.ss=.5;c.sl=500}
    if(this.color===INV)c.sk=COLOR.Gold;
    if(R()>.4&&!ht){c.sc=INV;c.trans=Math.pow(R(),1.5)*700+500}
    c.death=cm=>this.burst(cm.x,cm.y,cm.z)}
  burst(x,y,z){
    const speed=this.spreadSize/88*SPEEDK;let onDeath,sf,ss,sl,slv=.25,col;
    if(this.crossette)onDeath=s=>{crossetteFx(s)};
    if(this.crackle)onDeath=s=>{crackleFx(s)};
    if(this.floral)onDeath=floralFx;if(this.fallingLeaves)onDeath=leavesFx;
    if(this.glitter){const g=GL[this.glitter];sf=g[0]/QL();ss=g[1];sl=g[2];slv=g[3];if(this.glitter==='thick'&&high())ss=1.65}
    const std=this.spreadSize/1800,cm=this.comet,ox=this.horsetail&&cm?cm.vx:0,oy=this.horsetail&&cm?cm.vy:std,oz=this.horsetail&&cm?cm.vz:0;
    // REAL-LOOK CHANGE: every long-lived star keeps a smooth ribbon trail
    const apply=s=>{if(this.starLife>=600)s.hist=true;if(this.secondColor){s.trans=this.starLife*(R()*.05+.32);s.sc=this.secondColor}
      if(this.strobe){s.trans=this.starLife*(R()*.08+.46);s.strobe=true;s.sfq=R()*20+40;if(this.strobeColor)s.sc=this.strobeColor}
      if(this.swirl)s.sw=this.swirl;s.death=onDeath;if(this.glitter){s.sf=sf;s.ss=ss;s.sl=sl;s.slv=slv;s.sk=this.glitterColor;s.st=R()*sf}};
    const life=()=>this.starLife+R()*this.starLife*this.starLifeVariation;
    const factory=(dx,dy,dz,c)=>apply(addStar(x,y,z,c||randomColor(),dx,dy,dz,speed*(.7+R()*.3),life(),ox,oy,oz));
    if(!Array.isArray(this.color)){
      col=this.color==='random'?null:this.color;
      if(this.ring){const n=rdir().slice(),a0=[n[2],0,-n[0]],l=Math.hypot(a0[0],a0[2])||1,a=[a0[0]/l,0,a0[2]/l],b=[0,0,0];
        b[0]=n[1]*a[2]-n[2]*a[1];b[1]=n[2]*a[0]-n[0]*a[2];b[2]=n[0]*a[1]-n[1]*a[0];const cnt=this.starCount;
        for(let i=0;i<cnt;i++){const t=i/cnt*TAU,cs=Math.cos(t),sn=Math.sin(t);apply(addStar(x,y,z,col,a[0]*cs+b[0]*sn,a[1]*cs+b[1]*sn,a[2]*cs+b[2]*sn,speed,life()))}}
      else sphere(this.starCount,(dx,dy,dz)=>factory(dx,dy,dz,col))}
    else{const c0=this.color[0],c1=this.color[1];
      if(R()<.5){const n=rdir().slice();sphere(this.starCount,(dx,dy,dz)=>factory(dx,dy,dz,dx*n[0]+dy*n[1]+dz*n[2]>0?c0:c1))}
      else sphere(this.starCount,(dx,dy,dz)=>factory(dx,dy,dz,R()<.5?c0:c1))}
    // REAL-LOOK CHANGE: the instant "pop" - a burst of fast white-hot sparks that die within a few frames
    {const nf=low()?18:high()?56:34,fc=(col&&col!==INV)?col:COLOR.Gold;
      for(let i=0;i<nf;i++){rdir();addSpark(x,y,z,R()<.55?COLOR.White:fc,D[0],D[1],D[2],this.spreadSize/20*(.35+R()*.8),220+R()*260)}}
    if(this.pistil)new Shell({spreadSize:this.spreadSize*.5,starLife:this.starLife*.6,starLifeVariation:this.starLifeVariation,starDensity:1.4,color:this.pistilColor,glitter:'light',glitterColor:this.pistilColor===COLOR.Gold?COLOR.Gold:COLOR.White}).burst(x,y,z);
    if(this.streamers)new Shell({spreadSize:this.spreadSize*.9,starLife:this.starLife*.8,starLifeVariation:this.starLifeVariation,starCount:Math.floor(Math.max(6,this.spreadSize/45)),color:COLOR.White,glitter:'streamer'}).burst(x,y,z);
    burstFlash(x,y,z,this.spreadSize/4,this.comet?this.color:undefined)}
}

// ---------- sequences
function getRandomShellSize(){const base=shellSize(),mv=Math.min(2.5,base),v=R()*mv,size=base-v,height=mv===0?R():1-v/mv,co=R()*(1-height*.65)*.5,x=R()<.5?.5-co:.5+co;
  return{size,x:(1-.36)*x+.18,height:height*.75}}
function seqRandomShell(){const s=getRandomShellSize(),sh=new Shell(shellFromConfig(s.size));sh.launch(s.x,s.height);return 900+R()*600+(sh.fallingLeaves?4600:sh.starLife)}
function seqRandomFastShell(){const t=randomFastShell(),s=getRandomShellSize(),sh=new Shell(t(s.size));sh.launch(s.x,s.height);return 900+R()*600+sh.starLife}
function seqTwoRandom(){const a=getRandomShellSize(),b=getRandomShellSize(),s1=new Shell(shellFromConfig(a.size)),s2=new Shell(shellFromConfig(b.size));
  s1.launch(.3+R()*.2-.1,a.height);setTimeout(()=>s2.launch(.7+R()*.2-.1,b.height),100);
  return 900+R()*600+((s1.fallingLeaves||s2.fallingLeaves)?4600:Math.max(s1.starLife,s2.starLife))}
function seqTriple(){const t=randomFastShell(),base=shellSize(),small=Math.max(0,base-1.25),z=rz();new Shell(t(base)).launch(.5+R()*.08-.04,.7,z);
  setTimeout(()=>new Shell(t(small)).launch(.2+R()*.08-.04,.1,z),1000+R()*400);setTimeout(()=>new Shell(t(small)).launch(.8+R()*.08-.04,.1,z),1000+R()*400);return 4000}
function seqPyramid(){const half=innerWidth>800?7:4,large=shellSize(),small=Math.max(0,large-3),main=R()<.78?chrys:ring,z=rz();
  const go=(x,special)=>{const t=cfg.shell==='Random'?(special?shellTypes.Random:main):shellTypes[cfg.shell],h=x<=.5?x/.5:(1-x)/.5;new Shell(t(special?large:small)).launch(x,special?.75:h*.42,z)};
  let count=0,delay=0;while(count<=half){if(count===half)setTimeout(()=>go(.5,true),delay);else{const o=count/half*.5;setTimeout(()=>go(o,false),delay);setTimeout(()=>go(1-o,false),delay+R()*30+30)}count++;delay+=200}
  return 3400+half*250}
function seqSmallBarrage(){seqSmallBarrage.last=Date.now();const n=innerWidth>800?11:5,si=innerWidth>800?3:1,size=Math.max(0,shellSize()-2),main=R()<.78?chrys:ring,spec=randomFastShell(),z=rz();
  const go=(x,special)=>{const t=cfg.shell==='Random'?(special?spec:main):shellTypes[cfg.shell];new Shell(t(size)).launch(x,(Math.cos(x*5*Math.PI+Math.PI/2)+1)/2*.75,z)};
  let count=0,delay=0;while(count<n){if(count===0){go(.5,false);count++}else{const o=(count+1)/n/2,sp=count===si;setTimeout(()=>go(.5+o,sp),delay);setTimeout(()=>go(.5-o,sp),delay+R()*30+30);count+=2}delay+=200}
  return 3400+n*120}
seqSmallBarrage.last=Date.now();
const anars=[];
function anar(){const z=rz(),p=place(.12+R()*.76,0,z),y=-Math.abs(z)*.045;anars.push({x:p[0],y,z,t:2200+R()*1800,c:R()<.5?COLOR.Gold:COLOR.Orange});return 4200}
let firstSeq=true,finaleN=0;
function startSequence(){
  if(firstSeq){firstSeq=false;new Shell(chrys(shellSize())).launch(.5,.5);return 2400}
  if(cfg.finale){seqRandomFastShell();if(finaleN<32){finaleN++;return 170}finaleN=0;return 6000}
  const r=R();
  if(r<.08&&Date.now()-seqSmallBarrage.last>15000)return seqSmallBarrage();
  if(r<.1)return seqPyramid();if(r<.17)return anar();
  if(r<.6)return seqRandomShell();
  if(r<.8)return seqTwoRandom();
  return seqTriple()}

// ---------- simulation + render
const sky={r:0,g:0,b:0},glowEl=$('glow');let autoT=0,frame=0;
function update(dt){
  const speed=dt/16.6667,ts=dt,sd=1-DRAG*speed,sdh=1-.008*speed,spd=1-.1*speed,g=ts/1000*GRAV;frame++;
  windT+=ts/5000;wind=Math.sin(windT)*.6+Math.sin(windT*2.3+1)*.25;
  const wS=wind*.0035*speed,wK=wind*.02*speed;
  skyMat.uniforms.uTime.value=performance.now()/1000;skyA+=.00018*speed;skyStars.quaternion.setFromAxisAngle(POLE,skyA);
  if(cfg.auto){autoT-=ts;if(autoT<=0)autoT=startSequence()*.85}
  nq=0;let np=0,cnt=0,sr=0,sg=0,sb=0;
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];s.life-=ts;
    if(s.life<=0){stars[i]=stars[stars.length-1];stars.pop();const d=s.death;if(d)d(s);s.death=null;starPool.push(s);continue}
    const burn=Math.sqrt(s.life/s.full),bi=1-burn;s.px=s.x;s.py=s.y;s.pz=s.z;
    if(s.path){const p=s.path,u=1-s.life/s.full,e=p.lin?u:1-Math.pow(1-u,1.8);s.spinA+=.8*speed;
      s.x=p.fx+(p.tx-p.fx)*e+Math.sin(s.spinA)*s.spin;s.y=p.fy+(p.ty-p.fy)*e+Math.cos(s.spinA)*s.spin;s.z=p.fz+(p.tz-p.fz)*e}
    else{if(s.sw){const c_=Math.cos(s.sw*speed),n_=Math.sin(s.sw*speed),t_=s.vx*c_-s.vy*n_;s.vy=s.vx*n_+s.vy*c_;s.vx=t_}s.vx+=wS;s.x+=s.vx*speed;s.y+=s.vy*speed;s.z+=s.vz*speed;const dr=s.heavy?sdh:sd;s.vx*=dr;s.vy*=dr;s.vz*=dr;s.vy-=g}
    if(s.hist&&frame%2===0){if(!s.hx)s.hx=new Float32Array(H*3);const j=s.hi*3;s.hx[j]=s.x;s.hx[j+1]=s.y;s.hx[j+2]=s.z;s.hi=(s.hi+1)%H;if(s.hn<H)s.hn++}
    if(s.sf){s.st-=ts;while(s.st<0){s.st+=s.sf*.75+s.sf*bi*4;rdir();addSpark(s.x,s.y,s.z,s.sk,D[0],D[1],D[2],R()*s.ss*burn,s.sl*.8+R()*s.slv*s.sl)}}
    if(s.life<s.trans){if(s.sc&&!s.changed){s.changed=true;s.c=s.sc;if(s.sc===INV)s.sf=0}
      if(s.strobe)s.vis=Math.floor(s.life/s.sfq)%3===0}
    const c=s.c;if(c!==INV){cnt++;sr+=c.r;sg+=c.g;sb+=c.b}
    if(s.vis&&c!==INV){let r=c.r/255,gg=c.g/255,b=c.b/255;
      // white-hot at ignition -> true colour -> ember orange/red, with slight flicker
      const w=Math.max(0,1-bi*3.5)*.55,em=s.path?0:Math.max(0,(bi-.55)/.45),br=(1-em*.6)*(.68+R()*.32);
      r+=(1-r)*w;gg+=(1-gg)*w;b+=(1-b)*w;r+=(1-r)*em*.4;gg+=(.4-gg)*em*.5;b+=(.1-b)*em*.6;r*=br;gg*=br;b*=br;
      PP[np*3]=s.x;PP[np*3+1]=s.y;PP[np*3+2]=s.z;PC[np*3]=r;PC[np*3+1]=gg;PC[np*3+2]=b;np++;
      if(s.hist&&s.hn>2)ribbon(s,r,gg,b);else{const tl=TL/speed;quad(s.x,s.y,s.z,s.x-(s.x-s.px)*tl,s.y-(s.y-s.py)*tl,s.z-(s.z-s.pz)*tl,r,gg,b,(s.path?1.8:1.5)*PR)}}
    else if(s.hist&&s.vis&&c===INV&&s.hn>2&&s.sk!==INV){const k0=Math.sqrt(s.life/s.full)*.8,e=s.sk;ribbon(s,e.r/255*k0,e.g/255*k0,e.b/255*k0)}}
  for(let i=anars.length-1;i>=0;i--){const a=anars[i];a.t-=ts;if(a.t<=0){anars.splice(i,1);continue}
    for(let k=0;k<5;k++){const ang=R()*TAU,sp=.18+R()*.22;addSpark(a.x,a.y,a.z,R()<.3?COLOR.White:a.c,Math.cos(ang)*sp,1,Math.sin(ang)*sp,6+R()*7,350+R()*550)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=ts;
    if(s.life<=0){sparks[i]=sparks[sparks.length-1];sparks.pop();sparkPool.push(s);continue}
    s.px=s.x;s.py=s.y;s.pz=s.z;s.vx+=wK;s.x+=s.vx*speed;s.y+=s.vy*speed;s.z+=s.vz*speed;s.vx*=spd;s.vy*=spd;s.vz*=spd;s.vy-=g;
    const c=s.c,k=1*Math.min(1,s.life/s.full*2.2),tl=2.6;quad(s.x,s.y,s.z,s.x-(s.x-s.px)*tl,s.y-(s.y-s.py)*tl,s.z-(s.z-s.pz)*tl,c.r/255*k,c.g/255*k,c.b/255*k,.75*PR)}
  for(let i=lights.length-1;i>=0;i--){const L=lights[i];L.life-=ts;if(L.life<=0){lights[i]=lights[lights.length-1];lights.pop()}}
  if(cfg.sky){const maxSat=cfg.sky*8,inten=Math.pow(Math.min(1,cnt/500),.3),mx=Math.max(1,sr,sg,sb);
    sky.r+=(sr/mx*maxSat*inten-sky.r)/10*speed;sky.g+=(sg/mx*maxSat*inten-sky.g)/10*speed;sky.b+=(sb/mx*maxSat*inten-sky.b)/10*speed}
  else sky.r=sky.g=sky.b=0;
  {const m=Math.max(1,sky.r,sky.g,sky.b),cr=sky.r/m*255|0,cg=sky.g/m*255|0,cb=sky.b/m*255|0,a=Math.min(.14,m/(Math.max(1,cfg.sky)*15)*.25+glowB*.08);glowB*=Math.pow(.95,speed);
    glowEl.style.background=`linear-gradient(to top,rgba(${cr},${cg},${cb},${a.toFixed(3)}),rgba(${cr},${cg},${cb},0))`}
  fadeMat.color.setRGB(sky.r/255,sky.g/255,sky.b/255);fadeMat.opacity=cfg.shutter?.0025:Math.min(1,.17*speed);
  pg.setDrawRange(0,np);lg.setDrawRange(0,nq*6);
  // upload only the used part of each buffer (keeps it fast with the bigger quad budget)
  ['position','color'].forEach(n=>{const a=pg.attributes[n];a.updateRange.offset=0;a.updateRange.count=np*3;a.needsUpdate=true});
  ['position','tail','color','aux'].forEach(n=>{const a=lg.attributes[n];a.updateRange.offset=0;a.updateRange.count=nq*12;a.needsUpdate=true});
  const sw=Math.sin(frame*.004),kx=innerHeight/900;camera.position.set(sw*16+(R()-.5)*shake*4,Math.sin(frame*.0031)*8+(R()-.5)*shake*4,0);
  LY[0].style.transform=`translateX(${(-sw*5*kx).toFixed(2)}px)`;LY[1].style.transform=`translateX(${(-sw*7.5*kx).toFixed(2)}px)`;LY[2].style.transform=`translateX(${(-sw*12*kx).toFixed(2)}px)`;shake*=Math.pow(.88,speed);renderer.render(FADE,ortho);renderer.render(scene,camera);
  flashActive.forEach(s=>{scene.remove(s);flashPool.push(s)});flashActive=[]}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(now-last,48);last=now;if(running())update(dt)}
requestAnimationFrame(loop);

// ---------- UI
const fill=(id,a)=>$(id).innerHTML=a.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
fill('o_shell',shellNames.map(n=>[n,n]));fill('o_size',['3"','4"','6"','8"','12"','16"'].map((l,i)=>[i,l]));fill('o_q',[[1,'Low'],[2,'Normal'],[3,'High']]);fill('o_sky',[[0,'None'],[1,'Dim'],[2,'Normal']]);
function sync(){$('o_shell').value=cfg.shell;$('o_size').value=cfg.size;$('o_q').value=cfg.quality;$('o_sky').value=cfg.sky;$('o_auto').checked=cfg.auto;$('o_fin').checked=cfg.finale;$('o_hide').checked=cfg.hide;$('o_shut').checked=cfg.shutter;
  $('bp').textContent=paused?'▶':'⏸';$('menu').classList.toggle('on',menuOpen);$('ctl').classList.toggle('off',cfg.hide||menuOpen)}
const bind=(id,k,fn=v=>v,ev='input')=>$(id).addEventListener(ev,e=>{cfg[k]=fn(e.target.type==='checkbox'?e.target.checked:e.target.value);sync()});
bind('o_shell','shell');bind('o_size','size',Number);bind('o_q','quality',Number);bind('o_sky','sky',Number);bind('o_auto','auto',v=>v,'change');bind('o_fin','finale',v=>v,'change');bind('o_hide','hide',v=>v,'change');bind('o_shut','shutter',v=>v,'change');
$('bp').onclick=()=>{paused=!paused;sync()};$('bm').onclick=()=>{menuOpen=true;sync()};$('cl').onclick=()=>{menuOpen=false;sync()};
addEventListener('keydown',e=>{if(e.keyCode===80){paused=!paused}else if(e.keyCode===79){menuOpen=!menuOpen}else if(e.keyCode===27){menuOpen=false}sync()});
cvs.addEventListener('pointerdown',e=>{if(!running())return;const z=-(1000+R()*400),d=new THREE.Vector3(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,.5).unproject(camera).sub(camera.position).normalize(),t=Math.abs(z)/Math.max(.2,-d.z);
  new Shell(shellFromConfig(shellSize())).launchAt(d.x*t,Math.max(250,d.y*t),d.z*t)});
sync();
</script>
