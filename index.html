<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali – Fireworks 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;family=Yatra+One&amp;family=Great+Vibes&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ui:rgba(255,255,255,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;color:var(--ui);font-family:'Russo One',Arial,sans-serif;letter-spacing:.06em}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#glow{position:fixed;left:0;right:0;bottom:0;height:40%;pointer-events:none;mix-blend-mode:screen}
.ly{position:fixed;left:-4%;bottom:0;width:108%;pointer-events:none;display:block;will-change:transform}
#l1{height:15%}#l2{height:10%}#sil{height:6%}
#sk{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(to top,rgba(26,38,78,.55) 0%,rgba(12,18,42,.35) 22%,rgba(5,8,20,.2) 55%,rgba(0,0,0,0) 100%)}
#ctl{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;transition:opacity .3s}
#ctl.off{opacity:0;pointer-events:none}
.b{width:50px;height:50px;border:0;background:none;color:#fff;font-size:22px;opacity:.2;cursor:pointer;transition:opacity .3s}
.b:hover{opacity:.5}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center}
#menu.on{display:flex}
.in{width:100%;max-width:400px;padding:16px;max-height:100%;overflow:auto}
h2{margin:0 0 14px;text-align:center;text-transform:uppercase;font-weight:400;font-size:2em}
label{display:flex;align-items:center;margin:14px 0;text-transform:uppercase}
label>span{width:50%;padding-right:12px;text-align:right}
select{width:50%;height:30px;font:inherit;color:var(--ui);background:transparent;border:1px solid var(--ui)}
select option{background:#000}
input[type=checkbox]{width:26px;height:26px;margin:0;opacity:.6}
#cl{display:block;margin:18px auto 0;font:inherit;color:#fff;background:rgba(255,255,255,.25);border:0;border-radius:2px;padding:6px 18px;text-transform:uppercase;cursor:pointer}
#cl:hover{background:#09f}
small{display:block;text-align:center;opacity:.7;margin-top:14px;font-size:.75em}
/* centre greeting */
#hd{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;animation:hd 11s ease-in-out 1.2s forwards;letter-spacing:0}
#hd .hi{font-family:'Yatra One','Noto Sans Devanagari',serif;font-size:clamp(26px,5.5vw,64px);letter-spacing:.08em;background:linear-gradient(180deg,#fff3c4,#ffb938 55%,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,140,20,.75))}
#hd .en{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(64px,17vw,200px);line-height:1.05;margin-top:.05em;background:linear-gradient(180deg,#fffbe8 0%,#ffd86b 50%,#ff9d2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,150,30,.8)) drop-shadow(0 0 60px rgba(255,80,0,.5))}
#hd .or{font-size:clamp(14px,2.4vw,26px);color:#ffcf6b;opacity:.85;letter-spacing:.7em;margin-top:.4em;text-shadow:0 0 12px rgba(255,140,20,.8)}
@keyframes hd{0%{opacity:0;transform:scale(.94);filter:blur(8px)}16%,72%{opacity:1;transform:scale(1);filter:none}100%{opacity:0;transform:scale(1.04);filter:blur(4px)}}
</style></head>

<label><span>Shell Type</span><select id="o_shell"><option value="Random">Random</option><option value="Crackle">Crackle</option><option value="Crossette">Crossette</option><option value="Crysanthemum">Crysanthemum</option><option value="Falling Leaves">Falling Leaves</option><option value="Floral">Floral</option><option value="Ghost">Ghost</option><option value="Horse Tail">Horse Tail</option><option value="Palm">Palm</option><option value="Ring">Ring</option><option value="Strobe">Strobe</option><option value="Swirl">Swirl</option><option value="Willow">Willow</option></select></label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const R=Math.random,TAU=Math.PI*2,rnd=(a,b)=>a+R()*(b-a),$=id=>document.getElementById(id);
const IS_MOBILE=innerWidth<=640,HI=(navigator.hardwareConcurrency||0)>=(innerWidth<=1024?4:8);
const cfg={quality:HI?3:2,shell:'Random',size:IS_MOBILE?2:3,auto:true,finale:false,sky:2,shutter:false,hide:false};
let paused=false,menuOpen=false;
const QL=()=>+cfg.quality,low=()=>QL()===1,high=()=>QL()===3,running=()=>!paused&&!menuOpen;
const playSound=()=>{},delayOf=()=>0;

// ---------- colours
const mk=(r,g,b)=>({r,g,b}),COLOR={Red:mk(255,0,67),Green:mk(20,252,86),Blue:mk(30,127,255),Purple:mk(230,10,255),Gold:mk(255,191,54),Orange:mk(255,105,15),Pink:mk(255,40,140),White:mk(255,255,255)},INV=mk(0,0,0);
const WC=[COLOR.Gold,COLOR.Gold,COLOR.Gold,COLOR.Orange,COLOR.Orange,COLOR.Red,COLOR.Pink,COLOR.Green,COLOR.Blue,COLOR.Purple,COLOR.White],rc0=()=>WC[R()*WC.length|0];let lastColor;
function randomColor(o={}){let c=rc0();if(o.limitWhite&&c===COLOR.White&&R()<.6)c=rc0();
  if(o.notSame)while(c===lastColor)c=rc0();else if(o.notColor)while(c===o.notColor)c=rc0();lastColor=c;return c}
const whiteOrGold=()=>R()<.5?COLOR.Gold:COLOR.White,pistilFor=c=>(c===COLOR.White||c===COLOR.Gold)?randomColor({notColor:c}):whiteOrGold();

// ---------- shell types (no heart)
const chrys=(s=1)=>{const glitter=R()<.65,single=R()<.72,color=single?randomColor({limitWhite:true}):[randomColor(),randomColor({notSame:true})],
  pistil=single&&R()<.45,pc=pistil&&pistilFor(color),second=single&&(R()<.2||color===COLOR.White)?pc||randomColor({notColor:color,limitWhite:true}):null,
  streamers=!pistil&&color!==COLOR.White&&R()<.42;let d=glitter?1.9:2.1;if(low())d*=.8;if(high())d=2.2;
  return{shellSize:s,spreadSize:320+s*105,starLife:1000+s*220,starDensity:d,color,secondColor:second,glitter:glitter?'light':'',glitterColor:whiteOrGold(),pistil,pistilColor:pc,streamers}};
const ghost=(s=1)=>{const h=chrys(s);h.starLife*=1.5;const gc=randomColor({notColor:COLOR.White});h.streamers=true;h.color=INV;h.secondColor=gc;h.glitter='';return h};
const strobe=(s=1)=>{const color=randomColor({limitWhite:true});return{shellSize:s,spreadSize:280+s*92,starLife:1100+s*200,starLifeVariation:.4,starDensity:1.2,color,glitter:'light',glitterColor:COLOR.White,strobe:true,strobeColor:R()<.5?COLOR.White:null,pistil:R()<.5,pistilColor:pistilFor(color)}};
const palm=(s=1)=>{const thick=R()<.5;return{shellSize:s,color:randomColor(),spreadSize:250+s*75,starDensity:thick?.15:.4,starLife:1800+s*200,glitter:thick?'thick':'heavy'}};
const ring=(s=1)=>{const color=randomColor(),pistil=R()<.75;return{shellSize:s,ring:true,color,spreadSize:300+s*100,starLife:900+s*200,starCount:2.2*TAU*(s+1),pistil,pistilColor:pistilFor(color),glitter:!pistil?'light':'',glitterColor:color===COLOR.Gold?COLOR.Gold:COLOR.White,streamers:R()<.3}};
const crossette=(s=1)=>{const color=randomColor({limitWhite:true});return{shellSize:s,spreadSize:300+s*100,starLife:750+s*160,starLifeVariation:.4,starDensity:.85,color,crossette:true,pistil:R()<.5,pistilColor:pistilFor(color)}};
const floral=(s=1)=>({shellSize:s,spreadSize:300+s*120,starDensity:.12,starLife:500+s*50,starLifeVariation:.5,color:R()<.65?'random':(R()<.15?randomColor():[randomColor(),randomColor({notSame:true})]),floral:true});
const leaves=(s=1)=>({shellSize:s,color:INV,spreadSize:300+s*120,starDensity:.12,starLife:500+s*50,starLifeVariation:.5,glitter:'medium',glitterColor:COLOR.Gold,fallingLeaves:true});
const willow=(s=1)=>({shellSize:s,spreadSize:300+s*100,starDensity:.6,starLife:3000+s*300,glitter:'willow',glitterColor:COLOR.Gold,color:INV});
const crackle=(s=1)=>{const color=R()<.75?COLOR.Gold:randomColor();return{shellSize:s,spreadSize:380+s*75,starDensity:low()?.65:1,starLife:600+s*100,starLifeVariation:.32,glitter:'light',glitterColor:COLOR.Gold,color,crackle:true,pistil:R()<.65,pistilColor:pistilFor(color)}};
const horsetail=(s=1)=>{const color=randomColor();return{shellSize:s,horsetail:true,color,spreadSize:250+s*38,starDensity:.9,starLife:2500+s*300,glitter:'medium',glitterColor:R()<.5?whiteOrGold():color,strobe:color===COLOR.White}};

function seqSmallBarrage(){seqSmallBarrage.last=Date.now();const n=innerWidth>800?11:5,si=innerWidth>800?3:1,size=Math.max(0,shellSize()-2),main=R()<.78?chrys:ring,spec=randomFastShell(),z=rz();

  let count=0,delay=0;while(count<n){if(count===0){go(.5,false);count++}else{const o=(count+1)/n/2,sp=count===si;setTimeout(()=>go(.5+o,sp),delay);setTimeout(()=>go(.5-o,sp),delay+R()*30+30);count+=2}delay+=200}
  return 3400+n*120}
seqSmallBarrage.last=Date.now();
const anars=[];
function anar(){const z=rz(),p=place(.12+R()*.76,0,z),y=-Math.abs(z)*.045;anars.push({x:p[0],y,z,t:2200+R()*1800,c:R()<.5?COLOR.Gold:COLOR.Orange});return 4200}
let firstSeq=true,finaleN=0;
function startSequence(){
  if(firstSeq){firstSeq=false;new Shell(chrys(shellSize())).launch(.5,.5);return 2400}
  if(cfg.finale){seqRandomFastShell();if(finaleN<32){finaleN++;return 170}finaleN=0;return 6000}
  const r=R();
  if(r<.08&&Date.now()-seqSmallBarrage.last>15000)return seqSmallBarrage();
  if(r<.1)return seqPyramid();if(r<.17)return anar();
  if(r<.6)return seqRandomShell();
  if(r<.8)return seqTwoRandom();
  return seqTriple()}

// ---------- simulation + render
const sky={r:0,g:0,b:0},glowEl=$('glow');let autoT=0,frame=0;
function update(dt){
  const speed=dt/16.6667,ts=dt,sd=1-.02*speed,sdh=1-.008*speed,spd=1-.1*speed,g=ts/1000*GRAV;frame++;
  windT+=ts/5000;wind=Math.sin(windT)*.6+Math.sin(windT*2.3+1)*.25;
  const wS=wind*.0035*speed,wK=wind*.02*speed;
  skyMat.uniforms.uTime.value=performance.now()/1000;skyA+=.00018*speed;skyStars.quaternion.setFromAxisAngle(POLE,skyA);
  if(cfg.auto){autoT-=ts;if(autoT<=0)autoT=startSequence()*.85}
  nq=0;let np=0,cnt=0,sr=0,sg=0,sb=0;
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];s.life-=ts;
    if(s.life<=0){stars[i]=stars[stars.length-1];stars.pop();const d=s.death;if(d)d(s);s.death=null;starPool.push(s);continue}
    const burn=Math.sqrt(s.life/s.full),bi=1-burn;s.px=s.x;s.py=s.y;s.pz=s.z;
    if(s.path){const p=s.path,u=1-s.life/s.full,e=p.lin?u:1-Math.pow(1-u,1.8);s.spinA+=.8*speed;
      s.x=p.fx+(p.tx-p.fx)*e+Math.sin(s.spinA)*s.spin;s.y=p.fy+(p.ty-p.fy)*e+Math.cos(s.spinA)*s.spin;s.z=p.fz+(p.tz-p.fz)*e}
    else{if(s.sw){const c_=Math.cos(s.sw*speed),n_=Math.sin(s.sw*speed),t_=s.vx*c_-s.vy*n_;s.vy=s.vx*n_+s.vy*c_;s.vx=t_}s.vx+=wS;s.x+=s.vx*speed;s.y+=s.vy*speed;s.z+=s.vz*speed;const dr=s.heavy?sdh:sd;s.vx*=dr;s.vy*=dr;s.vz*=dr;s.vy-=g}
    if(s.hist&&frame%2===0){if(!s.hx)s.hx=new Float32Array(H*3);const j=s.hi*3;s.hx[j]=s.x;s.hx[j+1]=s.y;s.hx[j+2]=s.z;s.hi=(s.hi+1)%H;if(s.hn<H)s.hn++}
    if(s.sf){s.st-=ts;while(s.st<0){s.st+=s.sf*.75+s.sf*bi*4;rdir();addSpark(s.x,s.y,s.z,s.sk,D[0],D[1],D[2],R()*s.ss*burn,s.sl*.8+R()*s.slv*s.sl)}}
    if(s.life<s.trans){if(s.sc&&!s.changed){s.changed=true;s.c=s.sc;if(s.sc===INV)s.sf=0}
      if(s.strobe)s.vis=Math.floor(s.life/s.sfq)%3===0}
    const c=s.c;if(c!==INV){cnt++;sr+=c.r;sg+=c.g;sb+=c.b}
    if(s.vis&&c!==INV){let r=c.r/255,gg=c.g/255,b=c.b/255;
      const w=Math.max(0,1-bi*3.5)*.5,em=s.path?0:Math.max(0,(bi-.55)/.45),br=(1-em*.55)*(.8+R()*.2);
      r+=(1-r)*w;gg+=(1-gg)*w;b+=(1-b)*w;r+=(1-r)*em*.4;gg+=(.4-gg)*em*.5;b+=(.1-b)*em*.6;r*=br;gg*=br;b*=br;
      PP[np*3]=s.x;PP[np*3+1]=s.y;PP[np*3+2]=s.z;PC[np*3]=r;PC[np*3+1]=gg;PC[np*3+2]=b;np++;
      if(s.hist&&s.hn>2)ribbon(s,r,gg,b);else{const tl=TL/speed;quad(s.x,s.y,s.z,s.x-(s.x-s.px)*tl,s.y-(s.y-s.py)*tl,s.z-(s.z-s.pz)*tl,r,gg,b,(s.path?1.8:1.5)*PR)}}
    else if(s.hist&&s.vis&&c===INV&&s.hn>2&&s.sk!==INV){const k0=Math.sqrt(s.life/s.full)*.8,e=s.sk;ribbon(s,e.r/255*k0,e.g/255*k0,e.b/255*k0)}}
  for(let i=anars.length-1;i>=0;i--){const a=anars[i];a.t-=ts;if(a.t<=0){anars.splice(i,1);continue}
    for(let k=0;k<5;k++){const ang=R()*TAU,sp=.18+R()*.22;addSpark(a.x,a.y,a.z,R()<.3?COLOR.White:a.c,Math.cos(ang)*sp,1,Math.sin(ang)*sp,6+R()*7,350+R()*550)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=ts;
    if(s.life<=0){sparks[i]=sparks[sparks.length-1];sparks.pop();sparkPool.push(s);continue}
    s.px=s.x;s.py=s.y;s.pz=s.z;s.vx+=wK;s.x+=s.vx*speed;s.y+=s.vy*speed;s.z+=s.vz*speed;s.vx*=spd;s.vy*=spd;s.vz*=spd;s.vy-=g;
    const c=s.c,k=1*Math.min(1,s.life/s.full*2.2),tl=2.6;quad(s.x,s.y,s.z,s.x-(s.x-s.px)*tl,s.y-(s.y-s.py)*tl,s.z-(s.z-s.pz)*tl,c.r/255*k,c.g/255*k,c.b/255*k,.75*PR)}
  for(let i=lights.length-1;i>=0;i--){const L=lights[i];L.life-=ts;if(L.life<=0){lights[i]=lights[lights.length-1];lights.pop()}}
  if(cfg.sky){const maxSat=cfg.sky*8,inten=Math.pow(Math.min(1,cnt/500),.3),mx=Math.max(1,sr,sg,sb);
    sky.r+=(sr/mx*maxSat*inten-sky.r)/10*speed;sky.g+=(sg/mx*maxSat*inten-sky.g)/10*speed;sky.b+=(sb/mx*maxSat*inten-sky.b)/10*speed}
  else sky.r=sky.g=sky.b=0;
  {const m=Math.max(1,sky.r,sky.g,sky.b),cr=sky.r/m*255|0,cg=sky.g/m*255|0,cb=sky.b/m*255|0,a=Math.min(.14,m/(Math.max(1,cfg.sky)*15)*.25+glowB*.08);glowB*=Math.pow(.95,speed);
    glowEl.style.background=`linear-gradient(to top,rgba(${cr},${cg},${cb},${a.toFixed(3)}),rgba(${cr},${cg},${cb},0))`}
  fadeMat.color.setRGB(sky.r/255,sky.g/255,sky.b/255);fadeMat.opacity=cfg.shutter?.0025:Math.min(1,.17*speed);
  pg.setDrawRange(0,np);lg.setDrawRange(0,nq*6);
  pg.attributes.position.needsUpdate=pg.attributes.color.needsUpdate=true;['position','tail','color','aux'].forEach(n=>lg.attributes[n].needsUpdate=true);
  const sw=Math.sin(frame*.004),kx=innerHeight/900;camera.position.set(sw*16+(R()-.5)*shake*4,Math.sin(frame*.0031)*8+(R()-.5)*shake*4,0);
  LY[0].style.transform=`translateX(${(-sw*5*kx).toFixed(2)}px)`;LY[1].style.transform=`translateX(${(-sw*7.5*kx).toFixed(2)}px)`;LY[2].style.transform=`translateX(${(-sw*12*kx).toFixed(2)}px)`;shake*=Math.pow(.88,speed);renderer.render(FADE,ortho);renderer.render(scene,camera);
  flashActive.forEach(s=>{scene.remove(s);flashPool.push(s)});flashActive=[]}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(now-last,48);last=now;if(running())update(dt)}
requestAnimationFrame(loop);

// ---------- UI
const fill=(id,a)=>$(id).innerHTML=a.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
fill('o_shell',shellNames.map(n=>[n,n]));fill('o_size',['3"','4"','6"','8"','12"','16"'].map((l,i)=>[i,l]));fill('o_q',[[1,'Low'],[2,'Normal'],[3,'High']]);fill('o_sky',[[0,'None'],[1,'Dim'],[2,'Normal']]);
function sync(){$('o_shell').value=cfg.shell;$('o_size').value=cfg.size;$('o_q').value=cfg.quality;$('o_sky').value=cfg.sky;$('o_auto').checked=cfg.auto;$('o_fin').checked=cfg.finale;$('o_hide').checked=cfg.hide;$('o_shut').checked=cfg.shutter;
  $('bp').textContent=paused?'▶':'⏸';$('menu').classList.toggle('on',menuOpen);$('ctl').classList.toggle('off',cfg.hide||menuOpen)}
const bind=(id,k,fn=v=>v,ev='input')=>$(id).addEventListener(ev,e=>{cfg[k]=fn(e.target.type==='checkbox'?e.target.checked:e.target.value);sync()});
bind('o_shell','shell');bind('o_size','size',Number);bind('o_q','quality',Number);bind('o_sky','sky',Number);bind('o_auto','auto',v=>v,'change');bind('o_fin','finale',v=>v,'change');bind('o_hide','hide',v=>v,'change');bind('o_shut','shutter',v=>v,'change');
$('bp').onclick=()=>{paused=!paused;sync()};$('bm').onclick=()=>{menuOpen=true;sync()};$('cl').onclick=()=>{menuOpen=false;sync()};
addEventListener('keydown',e=>{if(e.keyCode===80){paused=!paused}else if(e.keyCode===79){menuOpen=!menuOpen}else if(e.keyCode===27){menuOpen=false}sync()});
cvs.addEventListener('pointerdown',e=>{if(!running())return;const z=-(1000+R()*400),d=new THREE.Vector3(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,.5).unproject(camera).sub(camera.position).normalize(),t=Math.abs(z)/Math.max(.2,-d.z);
  new Shell(shellFromConfig(shellSize())).launchAt(d.x*t,Math.max(250,d.y*t),d.z*t)});
sync();
