<script>

//  • white-hot -> colour -> orange ember colour curve on every star
//  • gradient comet trails + sparks that fade out as they burn

const leaves=(s=1)=>({shellSize:s,color:INV,spreadSize:300+s*120,starDensity:.12,starLife:500+s*50,starLifeVariation:.5,glitter:'medium',glitterColor:COLOR.Gold,fallingLeaves:true});
const willow=(s=1)=>({shellSize:s,spreadSize:300+s*100,starDensity:.6,starLife:3000+s*300,glitter:'willow',glitterColor:COLOR.Gold,color:INV});

const randomShellName=()=>R()<.5?'Crysanthemum':shellNames[(R()*(shellNames.length-1)+1)|0];

function tone(f0,f1,dur,vol,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);

  else if(type==='burst'){const d=.2+R()*.15+dl0;nz('lowpass',700,50,2,.9*sc,d);tone(95,28,.6,.7*sc,d);nz('highpass',1500,1501,.12,.25*sc,d)}
  else if(type==='burstSmall'){const n=Date.now();if(n-lastSmall<20)return;lastSmall=n;nz('lowpass',1500,200,.25,.18,.15+dl0)}
  else{const n=type==='crackle'?16:6;for(let i=0;i<n;i++)nz('highpass',4000,4001,.04,type==='crackle'?.18:.25,.15+dl0+R()*1.2)}}
const delayOf=z=>Math.abs(z)/1800;

// ---------- three.js scene
const cvs=$('c'),renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:false,preserveDrawingBuffer:true});

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,10,6000),FADE=new THREE.Scene(),ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fadeMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.175,depthTest:false,depthWrite:false});
FADE.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),fadeMat));
const glow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const flashTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(.024,'rgba(255,255,255,1)');g.addColorStop(.125,'rgba(255,160,20,.2)');g.addColorStop(.32,'rgba(255,140,20,.11)');g.addColorStop(1,'rgba(255,120,20,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
// night-sky starfield (far away, dim, twinkles)
const SN=240,SP=new Float32Array(SN*3),SC=new Float32Array(SN*3);
for(let i=0;i<SN;i++){SP[i*3]=(R()*2-1)*3600;SP[i*3+1]=R()*3800;SP[i*3+2]=-5000-R()*400;const b=.06+Math.pow(R(),4)*.4,t=R();SC[i*3]=b*(.8+.2*t);SC[i*3+1]=b*.9;SC[i*3+2]=b*(1-.2*t)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(SP,3));sg.setAttribute('color',new THREE.BufferAttribute(SC,3));
const skyStars=new THREE.Points(sg,new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.8,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending}));
const CAPS=7000,CAPK=14000;
const PP=new Float32Array(CAPS*3),PC=new Float32Array(CAPS*3);
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(PP,3).setUsage(THREE.DynamicDrawUsage));pg.setAttribute('color',new THREE.BufferAttribute(PC,3).setUsage(THREE.DynamicDrawUsage));
const PR=Math.min(devicePixelRatio,2),CAPQ=CAPS+CAPK,QH=new Float32Array(CAPQ*12),QT=new Float32Array(CAPQ*12),QC=new Float32Array(CAPQ*12),QA=new Float32Array(CAPQ*12),QI=new Uint32Array(CAPQ*6);
for(let i=0;i<CAPQ;i++){const v=i*4;QI.set([v,v+1,v+2,v+1,v+3,v+2],i*6);for(let k=0;k<4;k++){QA[(v+k)*3]=k%2?1:-1;QA[(v+k)*3+1]=k>1?1:0}}
const lg=new THREE.BufferGeometry();
[['position',QH],['tail',QT],['color',QC],['aux',QA]].forEach(([n,a])=>lg.setAttribute(n,new THREE.BufferAttribute(a,3).setUsage(THREE.DynamicDrawUsage)));
lg.setIndex(new THREE.BufferAttribute(QI,1));
let nq=0;
function quad(x,y,z,tx,ty,tz,r,g,b,w,r2,g2,b2){if(nq>=CAPQ)return;const o=nq*12,e=r2!==undefined;for(let k=0;k<4;k++){const j=o+k*3,u=e&&k>1;QH[j]=x;QH[j+1]=y;QH[j+2]=z;QT[j]=tx;QT[j+1]=ty;QT[j+2]=tz;QC[j]=u?r2:r;QC[j+1]=u?g2:g;QC[j+2]=u?b2:b;QA[j+2]=w}nq++}
// polyline trail through the star's recent positions; colour fades head->tail with no taper seams (negative width = no taper)
function ribbon(s,r,g,b){const S=Math.min(s.hn,H-1),Q=6;let px=s.x,py=s.y,pz=s.z;
  for(let q=0;q<Q;q++){const i=((s.hi-Math.round((q+1)*S/Q)+H*2)%H)*3,x=s.hx[i],y=s.hx[i+1],z=s.hx[i+2],k0=Math.pow(1-q/Q,1.4),k1=Math.pow(1-(q+1)/Q,1.4);

const rMat=new THREE.ShaderMaterial({uniforms:{uRes:{value:new THREE.Vector2(1,1)}},transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,

void main(){vec4 a=projectionMatrix*modelViewMatrix*vec4(position,1.);vec4 b=projectionMatrix*modelViewMatrix*vec4(tail,1.);
vec2 sa=a.xy/a.w*uRes*.5,sb=b.xy/b.w*uRes*.5,d=sb-sa;float L=length(d);vec2 dir=L>.001?d/L:vec2(0.,1.);L=max(L,2.);

  fragmentShader:`varying vec3 vC;varying vec3 vA;void main(){float t=1.-vA.y;gl_FragColor=vec4(vC*1.4,mix(t*t,1.,vA.z)*(1.-vA.x*vA.x));}`});
const pmat=o=>new THREE.PointsMaterial({map:glow,size:10,vertexColors:true,transparent:true,opacity:o,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(pg,pmat(1)),bloom=new THREE.Points(pg,pmat(.09)); // bloom = same particles, huge + faint
const lines=new THREE.Mesh(lg,rMat);
[skyStars,bloom,pts,lines].forEach(o=>{o.frustumCulled=false;scene.add(o)});
const flashPool=[];let flashActive=[],glowB=0;
const lights=[];let shake=0;
function burstFlash(x,y,z,r,c){if(c!==undefined&&lights.length<24){c=Array.isArray(c)?c[0]:(c&&c!=='random'&&c!==INV?c:COLOR.Gold);lights.push({x,y,z,r:r*5,cr:c.r/255,cg:c.g/255,cb:c.b/255,i:Math.min(2,r/70),life:3500,full:3500});if(r>60)shake=Math.min(1,shake+r/260)}
  const s=flashPool.pop()||new THREE.Sprite(new THREE.SpriteMaterial({map:flashTex,transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.position.set(x,y,z);s.scale.set(r*1.8,r*1.8,1);scene.add(s);flashActive.push(s);glowB=Math.min(1,glowB+r/900)}

// ---------- volumetric smoke
// Each puff is a camera-facing sprite whose shape is generated in the fragment shader from rotated fractal noise.
// As a puff ages the noise threshold rises, so it erodes into thin wisps instead of fading as a blurry blob.
const CAPM=1800,MP=new Float32Array(CAPM*3),MC=new Float32Array(CAPM*3),MS=new Float32Array(CAPM),MI=new Float32Array(CAPM*2),smoke=[];
const mg=new THREE.BufferGeometry();
[['position',MP,3],['color',MC,3],['size',MS,1],['info',MI,2]].forEach(([n,a,k])=>mg.setAttribute(n,new THREE.BufferAttribute(a,k).setUsage(THREE.DynamicDrawUsage)));
const smokeMat=new THREE.ShaderMaterial({uniforms:{uS:{value:1}},transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute float size;attribute vec3 color;attribute vec2 info;varying vec3 vC;varying vec2 vI;uniform float uS;
void main(){vC=color;vI=info;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=min(size*uS/-mv.z,900.);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying vec2 vI;

  float edge=smoothstep(1.,.25,r+(d-.5)*.55);

const smokePts=new THREE.Points(mg,smokeMat);smokePts.frustumCulled=false;scene.add(smokePts);

      if(s.hist&&s.hn>2)ribbon(s,r,gg,b);else{const tl=TL/speed;quad(s.x,s.y,s.z,s.x-(s.x-s.px)*tl,s.y-(s.y-s.py)*tl,s.z-(s.z-s.pz)*tl,r,gg,b,(s.path?1.5:1.1)*PR)}}
